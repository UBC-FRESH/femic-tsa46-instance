# TSR-consistent TIPSY rule scaffold. The production lane is
# scripts/build_tsr_lane.sh; this file preserves the reviewed assumptions for
# the config-driven FEMIC pipeline.
schema_version: 1
tsa_code: '46'
metadata:
  source_tsr:
  - title: North Coast TSA Timber Supply Review 3 Data Package
    year: 2007
    url: https://www.for.gov.bc.ca/ftp/HTS/external/!publish/Timber_Supply_Review/TSA/North_Coast_21/TSR_2007/Data_Package/DFAM/north_coast_tsr3_data_package_june06.pdf
    notes: 'Table 5.2: OAF1 15%, OAF2 5%, regeneration delay 2 years for hemlock/balsam and 1 year for cedar/hemlock. Future AUs regenerate to the existing analysis-unit species composition.'
  - title: Mid Coast TSA Timber Supply Review 3 Data Package
    year: 2011
    url: https://www.for.gov.bc.ca/ftp/HTS/external/!publish/Timber_Supply_Review/TSA/Mid_Coast_19/TSR_2011/Data_Package/Midcoast_TSR3_Data_Package_Mar10-09.pdf
    notes: Predecessor TSA 19; used for species and regeneration context.
  author: UBC FRESH Lab
  created_utc: '2026-10-24T00:00:00+00:00'
  notes: Per-AU species mixes are derived from the calibrated VRI checkpoint by scripts/build_tsr_tipsy_input.py. This rule is the fallback for the legacy config-driven pipeline.
