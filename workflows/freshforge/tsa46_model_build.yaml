workflow:
  id: tsa46_model_build
  name: GBR North TSA 46 FEMIC to ws4 model-build workflow
  description: >
    Instance-owned FreshForge graph that rebuilds the TSA 46 model inputs with
    FEMIC, exports the Patchworks-compatible XML and fragments that ws4
    compiles, then builds, validates, simulates, reports, and prepares the web
    UI geometry. Run from the instance root.
nodes:
  - id: validate_case
    provider: femic.validate_case
    outputs:
      case_validation: case_preflight_ok
    parameters:
      instance_root: "."
      run_config: config/run_profile.tsa46_full.yaml
      tipsy_config_dir: config/tipsy

  - id: geospatial_preflight
    provider: femic.geospatial_preflight
    needs:
      - validate_case
    inputs:
      case_validation: validate_case.case_validation
    outputs:
      geospatial_runtime: geospatial_runtime_ok
    parameters:
      instance_root: "."

  - id: compile_upstream
    provider: femic.compile_upstream
    needs:
      - geospatial_preflight
    inputs:
      geospatial_runtime: geospatial_preflight.geospatial_runtime
    outputs:
      btc_handoff: tsa46_vdyp_handoff
    parameters:
      instance_root: "."
      run_config: config/run_profile.tsa46_full.yaml
      run_id: tsa46_full_20261023
      log_dir: runtime/logs
    artifacts:
      run_manifest: runtime/logs/run_manifest-tsa46_full_20261023.json

  - id: export_patchworks
    provider: femic.export_patchworks
    needs:
      - compile_upstream
    inputs:
      model_input_bundle: compile_upstream.btc_handoff
    outputs:
      patchworks_package: output/patchworks_tsa46_full
    parameters:
      instance_root: "."
      run_config: config/run_profile.tsa46_full.yaml
      tsa: "46"
      bundle_dir: data/model_input_bundle
      checkpoint: data/vri_vclr1p_checkpoint8.feather
      output_dir: output/patchworks_tsa46_full
    artifacts:
      forestmodel_xml: output/patchworks_tsa46_full/forestmodel.xml
      fragments: output/patchworks_tsa46_full/fragments/fragments.shp

  - id: build_dataset
    provider: tsa46.ws4.build_dataset
    needs:
      - export_patchworks
    outputs:
      dataset: runtime/tsa46_full/matrix
    parameters:
      instance_root: "."
      xml: output/patchworks_tsa46_full/forestmodel.xml
      fragments: output/patchworks_tsa46_full/fragments/fragments.shp
      out: runtime/tsa46_full/matrix
    artifacts:
      manifest: runtime/tsa46_full/matrix/manifest.json

  - id: validate_dataset
    provider: tsa46.ws4.validate_dataset
    needs:
      - build_dataset
    inputs:
      dataset: build_dataset.dataset
    outputs:
      validated_dataset: runtime/tsa46_full/matrix
    parameters:
      instance_root: "."
      dataset: runtime/tsa46_full/matrix

  - id: apply_dataset_quality
    provider: femic.ws4_quality
    needs:
      - validate_dataset
    inputs:
      dataset: validate_dataset.validated_dataset
    outputs:
      quality_report: runtime/tsa46_full/matrix/data_quality.yaml
    parameters:
      instance_root: "."
      dataset: runtime/tsa46_full/matrix
      sidecar: config/dataset_quality.yaml
      targets: config/targets.tsa46_full.yaml
      check: true
    artifacts:
      quality_report: runtime/tsa46_full/matrix/data_quality.yaml

  - id: build_baseline_schedule
    provider: tsa46.ws4.build_baseline_schedule
    needs:
      - validate_dataset
      - apply_dataset_quality
    inputs:
      validated_dataset: validate_dataset.validated_dataset
    outputs:
      schedule: runtime/tsa46_full/schedules/baseline.csv
    parameters:
      instance_root: "."
      dataset: runtime/tsa46_full/matrix
      out: runtime/tsa46_full/schedules/baseline.csv
      target_age: "60"
    artifacts:
      schedule: runtime/tsa46_full/schedules/baseline.csv
      summary: runtime/tsa46_full/schedules/baseline.summary.json

  - id: simulate_baseline
    provider: tsa46.ws4.simulate
    needs:
      - build_baseline_schedule
    inputs:
      schedule: build_baseline_schedule.schedule
    outputs:
      run: runtime/tsa46_full/runs/baseline
    parameters:
      instance_root: "."
      dataset: runtime/tsa46_full/matrix
      schedule: runtime/tsa46_full/schedules/baseline.csv
      out: runtime/tsa46_full/runs/baseline
      years: "100"
    artifacts:
      run: runtime/tsa46_full/runs/baseline
